name: Build and publish website to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      confirm_website_changes:
        description: Confirm website files have changed since the previous website deployment
        required: true
        type: boolean
        default: false
      confirm_separate_release:
        description: Confirm no desktop app package release is running and this is a separate website deployment
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmed deployment from main
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_WEBSITE_CHANGES: ${{ inputs.confirm_website_changes }}
          CONFIRM_SEPARATE_RELEASE: ${{ inputs.confirm_separate_release }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Website deployment must run from main."
            exit 1
          fi
          if [[ "$CONFIRM_WEBSITE_CHANGES" != "true" || "$CONFIRM_SEPARATE_RELEASE" != "true" ]]; then
            echo "::error::Both website deployment confirmations are required."
            exit 1
          fi

  build:
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Require website changes since the last deployment
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/check-deployment-changes.mjs

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Test website release gate
        working-directory: website
        run: npm test

      - name: Build static website
        working-directory: website
        run: npm run build

      - name: Write Pages deployment marker
        if: github.event_name == 'workflow_dispatch'
        run: node website/scripts/write-deployment-marker.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_website_changes && inputs.confirm_separate_release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
