# 推送 v版本号 的 tag 后自动测试，分别在 macOS 和 Linux 上打包，再汇总发布到 GitHub Releases，发布步骤见 docs/RELEASING.md
# 也可以在 Actions 页面手动运行：只打包不发布，全部安装包作为这次运行的产物上传，用来验证打包流程
name: 发布

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # 先确认 tag 和 package.json 的版本一致、更新日志写了这个版本、还没发布过，免得白打包
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version: 24

      - name: 检查版本
        if: github.event_name == 'push'
        run: node scripts/release.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    strategy:
      matrix:
        include:
          # dmg 只能在 macOS 上打；Apple 芯片的 runner 也能打 x64 的包
          - { name: mac, os: macos-latest, script: build:mac }
          - { name: linux, os: ubuntu-latest, script: build:linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ffmpeg 来自第三方站点，按系统和下载脚本缓存：脚本里的版本或校验值变了才重新下载
      - uses: actions/cache@v6
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}

      # 打包前会先跑类型检查和单元测试，覆盖率低于 vitest.config.mts 里的门槛也会失败
      - name: 打包
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          # 安装包本身已经压缩过
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 两个系统的安装包放到同一个 dist/ 里
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: 发布
        if: github.event_name == 'push'
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 生成 update.json
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release.mjs --dry-run

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bili-downloader
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/update.json
          compression-level: 0
          retention-days: 7
