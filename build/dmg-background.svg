<svg xmlns="http://www.w3.org/2000/svg" width="540" height="400" viewBox="0 0 540 400">
  <!-- dmg 安装窗口背景。图片尺寸就是窗口外框尺寸，访达会用标题栏盖住约 28px，所以底部留白、内容排在上面 372px 里
       两个图标的中心在 (140,148) 和 (400,148)，与 electron-builder.yml 的 dmg.contents 对应
       改完后运行 npm run icons 重新生成 background.png / background@2x.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8FB"/>
      <stop offset="1" stop-color="#FFEAF2"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF94B8"/>
      <stop offset="1" stop-color="#F0568A"/>
    </linearGradient>
  </defs>
  <rect width="540" height="400" fill="url(#bg)"/>
  <!-- 右上和左下两团淡色光晕，呼应图标的粉色 -->
  <circle cx="520" cy="0" r="120" fill="#FF94B8" fill-opacity="0.10"/>
  <circle cx="10" cy="372" r="90" fill="#FF94B8" fill-opacity="0.08"/>
  <!-- 图标下方的圆角托盘，让两个图标有个落点（托盘下半部分留给访达画的文件名） -->
  <rect x="78" y="84" width="124" height="148" rx="26" fill="#fff" fill-opacity="0.55"/>
  <rect x="338" y="84" width="124" height="148" rx="26" fill="#fff" fill-opacity="0.55"/>
  <!-- 由淡到浓的圆点 + 箭头 -->
  <g fill="#F0568A">
    <circle cx="226" cy="148" r="3.5" fill-opacity="0.25"/>
    <circle cx="244" cy="148" r="3.5" fill-opacity="0.4"/>
    <circle cx="262" cy="148" r="3.5" fill-opacity="0.55"/>
    <circle cx="280" cy="148" r="3.5" fill-opacity="0.7"/>
    <circle cx="298" cy="148" r="3.5" fill-opacity="0.85"/>
  </g>
  <path d="M306 134 L320 148 L306 162" fill="none" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Hiragino Sans GB" text-anchor="middle">
    <text x="270" y="286" font-size="15" font-weight="bold" fill="#4A3440">将「B站下载器」拖到「应用程序」即可安装</text>
    <text x="270" y="314" font-size="12" fill="#9A7F8B">首次打开若被拦截：系统设置 → 隐私与安全性 → 仍要打开</text>
  </g>
</svg>
