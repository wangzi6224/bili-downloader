<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- YouTube 主题下的应用图标（程序坞 / 窗口图标随界面平台切换）。和 icon.svg 同一套网格与光影；
       屏幕去掉了 B站小电视的天线，下面加一条播放进度条。刻意不用红底白三角，避免和 YouTube 的标志混淆。
       改完后运行 npm run icons 重新生成 icon-youtube.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A6E"/>
      <stop offset="1" stop-color="#D9001B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8A0012" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="226" y="302" width="572" height="420" rx="104" fill="#fff" fill-opacity="0.16"/>
  <g filter="url(#glyph)" fill="none" stroke="#fff" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <rect x="226" y="302" width="572" height="420" rx="104"/>
    <path d="M512 400 V572 M440 504 L512 576 L584 504"/>
    <path d="M226 812 H798" stroke-opacity="0.45"/>
    <path d="M226 812 H560"/>
  </g>
  <circle cx="560" cy="812" r="38" fill="#fff" filter="url(#glyph)"/>
</svg>
