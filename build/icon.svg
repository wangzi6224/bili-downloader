<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 应用图标源文件，按 macOS 图标网格（824×824，圆角 185）绘制；改完后运行 npm run icons 重新生成 icon.icns / icon.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF94B8"/>
      <stop offset="1" stop-color="#F0568A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#B2245A" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- 小电视屏幕的淡白底，单独画，不带投影 -->
  <rect x="244" y="376" width="536" height="380" rx="96" fill="#fff" fill-opacity="0.16"/>
  <g filter="url(#glyph)" fill="none" stroke="#fff" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <rect x="244" y="376" width="536" height="380" rx="96"/>
    <path d="M400 376 L338 270 M624 376 L686 270"/>
    <path d="M512 468 V650 M438 578 L512 652 L586 578"/>
  </g>
</svg>
