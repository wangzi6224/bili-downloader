<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 抖音主题下的应用图标（程序坞 / 窗口图标随界面平台切换）。和 icon.svg 同一套网格与光影；
       一块竖屏、里面一个下载箭头，右上角一个红点。刻意不用音符图形，避免和抖音的标志混淆。
       改完后运行 npm run icons 重新生成 icon-douyin.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35D6CF"/>
      <stop offset="1" stop-color="#068C88"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04514F" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="322" y="234" width="380" height="556" rx="104" fill="#fff" fill-opacity="0.16"/>
  <g filter="url(#glyph)" fill="none" stroke="#fff" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <rect x="322" y="234" width="380" height="556" rx="104"/>
    <path d="M512 382 V566 M440 498 L512 570 L584 498"/>
    <path d="M450 686 H574"/>
  </g>
  <circle cx="702" cy="254" r="62" fill="#FE2C55" stroke="#fff" stroke-width="26"/>
</svg>
