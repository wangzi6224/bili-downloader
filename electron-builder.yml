appId: com.wangzi6224.bili-downloader
productName: B站下载器
artifactName: bili-downloader-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# 每个架构只带自己的 ffmpeg
extraResources:
  - from: resources/ffmpeg/${arch}
    to: ffmpeg
npmRebuild: false
mac:
  category: public.app-category.video
  target:
    - dmg
    - zip
  # 没有开发者证书，用 ad-hoc 签名；Apple 芯片上未签名的 app 无法启动
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: B站下载器 ${version}
  # 背景自动取 build/background.png（含 @2x），由 npm run icons 从 build/dmg-background.svg 生成
  # 坐标是图标中心，要和背景里的托盘、箭头对齐
  iconSize: 96
  contents:
    - { x: 140, y: 148, type: file }
    - { x: 400, y: 148, type: link, path: /Applications, name: 应用程序 }
