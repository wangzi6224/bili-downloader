appId: com.wangzi6224.bili-downloader
productName: B站下载器
artifactName: bili-downloader-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# AI 去水印的推理引擎：原生二进制不能放在 asar 里加载；afterPack 再删掉其他系统的二进制
asarUnpack:
  - node_modules/onnxruntime-node/bin/**
  - node_modules/onnxruntime-node-legacy/bin/**
afterPack: scripts/afterPack.cjs
# 每个系统和架构只带自己的 ffmpeg（${platform} 是打包机的系统）
extraResources:
  - from: resources/ffmpeg/${platform}-${arch}
    to: ffmpeg
npmRebuild: false
# Electron 自带的语言包只留界面支持的语言（src/shared/i18n 的 LANGS）：原生菜单、右键菜单、文件对话框按它显示。
# Chromium 缺语言包时退回英文，en 不能删；繁体中文系统界面用简体，zh_TW 保留给系统对话框
electronLanguages:
  - en
  - zh_CN
  - zh_TW
  - ja
  - ko
  - fr
  - it
  - ru
  - hi
mac:
  category: public.app-category.video
  target:
    - dmg
    - zip
  # 没有开发者证书，用 ad-hoc 签名；Apple 芯片上未签名的 app 无法启动
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  # 声明支持的语言，macOS 才会按系统语言显示应用菜单里的系统项（服务、隐藏、退出等）
  extendInfo:
    CFBundleDevelopmentRegion: en
    CFBundleLocalizations: [en, zh_CN, zh_TW, ja, ko, fr, it, ru, hi]
  # 菜单栏图标（template 图片），由 npm run icons 从 build/tray.svg 生成
  extraResources:
    - from: build/trayTemplate.png
      to: trayTemplate.png
    - from: build/trayTemplate@2x.png
      to: trayTemplate@2x.png
dmg:
  title: B站下载器 ${version}
  # 打完后由 scripts/compress-dmg.mjs 改成 LZMA 压缩，electron-builder 给 dmg 生成的 blockmap 就对不上了，发布也用不到
  writeUpdateInfo: false
  # 背景自动取 build/background.png（含 @2x），由 npm run icons 从 build/dmg-background.svg 生成
  # 坐标是图标中心，要和背景里的托盘、箭头对齐
  iconSize: 96
  contents:
    - { x: 140, y: 148, type: file }
    - { x: 400, y: 148, type: link, path: /Applications, name: 应用程序 }
linux:
  # AppImage 单文件、能应用内自动更新；deb 给 Debian / Ubuntu 用户直接安装
  target:
    - AppImage
    - deb
  category: AudioVideo
  # deb 的一行简介；description 是 .desktop 的 Comment 和 deb 的详细说明
  synopsis: B站视频下载器
  description: 粘贴 B站链接即可下载视频、合集、番剧与电影
  executableName: bili-downloader
  # 各尺寸的 png 由 npm run icons 生成
  icon: build/icons
  maintainer: wangzi6224 <wangzi6224@gmail.com>
  # .desktop 文件名取 package.json 的 desktopName，和 Electron 的 app_id / WM_CLASS 一致，任务栏才能把窗口认成这个应用
  syncDesktopName: true
  desktop:
    entry:
      Name: B站下载器
      Keywords: bilibili;B站;下载;视频;
  # 窗口、托盘和通知用的图标（Linux 上没有 .app 里的 icns）
  extraResources:
    - from: build/icons/256x256.png
      to: icon.png
win:
  icon: build/icon.ico
  target:
    - nsis
  extraResources:
    - from: build/icon.png
      to: icon.png
nsis:
  # per-user 安装，更新时不需要管理员权限
  oneClick: true
  perMachine: false
  runAfterFinish: true
